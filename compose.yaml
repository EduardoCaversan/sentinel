name: sentinel
x-app: &app
  build:
    context: .
    target: base
  image: sentinel:local
  env_file:
    - path: .env
      required: false
  environment: &environment
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: mysql
    DB_HOST: mariadb
    DB_PORT: 3306
    DB_DATABASE: sentinel
    DB_USERNAME: sentinel
    DB_PASSWORD: ${DB_PASSWORD:-sentinel-local}
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: array
    LOG_CHANNEL: stderr
  volumes:
    - storage:/var/www/html/storage

services:
  init:
    <<: *app
    command: ["sh", "docker/setup.sh"]
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
  app:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  horizon:
    <<: *app
    user: www-data
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 90s
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  scheduler:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: sentinel
      MARIADB_USER: sentinel
      MARIADB_PASSWORD: ${DB_PASSWORD:-sentinel-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sentinel-root-local}
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  redis:
  storage:
