<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Do not log URLs, query strings, credentials, or authorization headers.
    LogFormat "%t %m %>s %D" sentinel
    CustomLog /proc/self/fd/1 sentinel
    ErrorLog /proc/self/fd/2
</VirtualHost>
